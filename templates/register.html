{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
    <section class="card" style="width:100%; max-width:400px; border-top:5px solid #059669;">
        <h2 style="text-align:center; margin-bottom:1.5rem;">📝 Student Registration</h2>
        <form action="{{ url_for('register') }}" method="POST" class="modern-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" required>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" name="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required>
            </div>
<!-- Add after Mobile Number field -->
<div style="text-align: left; margin-bottom: 1rem;">
    <label style="font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 5px;">Pin Number</label>
    <input type="text" name="pin" required placeholder="Enter student PIN" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px;">
</div>

            
                      <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div style="margin-top: 1rem; text-align:left; font-size:0.9rem; color:#444;">
    <label>
        <input type="checkbox" id="consentChk" required>
        I agree that my details may be used for sending alerts analytics and insights.
    </label>
</div>


            <button type="submit" style="background:#059669;">Register</button>

        </form>
        <p style="text-align:center; margin-top:1rem;">Registered? <a href="{{ url_for('login') }}">Login</a></p>
    </section>
</div>
<script nonce="{{ csp_nonce }}">
document.querySelector(".pin-form").addEventListener("submit", function(e) {
    if (!document.getElementById("consentChk").checked) {
        e.preventDefault();
        alert("Please agree to the data usage terms to continue.");
    }
});
</script>
<script nonce="{{ csp_nonce }}">
console.log("OK");
</script>

{% endblock %}
