{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <section class="card" style="width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #059669;">
        <h2 style="color: #111827; margin-bottom: 0.5rem;">📝 Student Registration</h2>
        <p style="color: #6b7280; margin-bottom: 1.5rem; font-size: 0.9rem;">Create an account to access resources.</p>
        
        <form action="{{ url_for('register') }}" method="POST">
            <div style="text-align: left; margin-bottom: 1rem;">
                <label style="font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 5px;">Username</label>
                <input type="text" name="username" required placeholder="Choose a username" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px;">
            </div>

            <div style="text-align: left; margin-bottom: 1rem;">
                <label style="font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 5px;">Mobile Number</label>
                <input type="tel" name="mobile" required placeholder="Enter 10-digit number" pattern="[0-9]{10}" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px;">
            </div>
            
            <div style="text-align: left; margin-bottom: 1.5rem;">
                <label style="font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 5px;">Password</label>
                <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px;">
            </div>
            
            <button type="submit" style="width: 100%; background: #059669; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Register Now</button>
        </form>
        
        <p style="margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: #059669; font-weight: bold;">Login here</a>
        </p>
    </section>
</div>
{% endblock %}
